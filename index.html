اء اللي بره.", "معالج صغير بيعمل نسخة عكسية للموجة دي (لما هي ترتفع، النسخة تنزل).", "السماعة بتشغل النسخة العكسية في ودنك مع الصوت الأصلي.", "الموجتين بيقابلوا بعض ويلغوا بعض، فبتسمع هدوء أكتر. ده اسمه التداخل الهدّام.", "الفكرة بتنجح أحسن مع الأصوات الثابتة زي موتور الطيارة، وأضعف مع الأصوات المفاجئة."], "f": ["الفكرة هي إلغاء الموجة بموجة عكسية.", "بتنجح أكتر مع الضوضاء الثابتة.", "محتاجة بطارية ومعالج."], "s": "السماعة مش بتخبي الصوت، هي بتضيف صوت تاني يمسحه.\n\n1. ميكروفون صغير على السماعة بيسمع صوت الضوضاء اللي بره.\n2. معالج صغير بيعمل نسخة عكسية للموجة دي (لما هي ترتفع، النسخة تنزل).\n3. السماعة بتشغل النسخة العكسية في ودنك مع الصوت الأصلي.\n4. الموجتين بيقابلوا بعض ويلغوا بعض، فبتسمع هدوء أكتر. ده اسمه التداخل الهدّام.\n5. الفكرة بتنجح أحسن مع الأصوات الثابتة زي موتور الطيارة، وأضعف مع الأصوات المفاجئة."}, {"n": 8, "t": "الطيارة الضخمة بتطير ازاي؟", "e": "How a Heavy Plane Flies", "h": "طيارة وزنها مئات الأطنان بتطلع في الهوا. إزاي؟", "b": ["الجناح شكله مصمم إنه يدفع الهوا لتحت وهو بيتحرك لقدام.", "لما الهوا بيتدفع لتحت، الجناح بياخد دفعة لفوق. ده رد فعل (قانون نيوتن الثالث).", "كمان الضغط فوق الجناح بيبقى أقل من تحته، فيحصل رفع.", "المحركات بتدفع الطيارة لقدام، والسرعة هي اللي بتعمل الرفع. من غير سرعة مفيش رفع.", "الذيل والجنيحات بتحكم الاتجاه: يمين وشمال وطلوع ونزول.", "عشان كده الطيارة لازم تجري على المدرج الأول."], "f": ["الرفع ينتج من سرعة الهوا على الجناح.", "هو دفع الهوا لتحت وفرق ضغط.", "لازم سرعة كافية للإقلاع."], "s": "طيارة وزنها مئات الأطنان بتطلع في الهوا. إزاي؟\n\n1. الجناح شكله مصمم إنه يدفع الهوا لتحت وهو بيتحرك لقدام.\n2. لما الهوا بيتدفع لتحت، الجناح بياخد دفعة لفوق. ده رد فعل (قانون نيوتن الثالث).\n3. كمان الضغط فوق الجناح بيبقى أقل من تحته، فيحصل رفع.\n4. المحركات بتدفع الطيارة لقدام، والسرعة هي اللي بتعمل الرفع. من غير سرعة مفيش رفع.\n5. الذيل والجنيحات بتحكم الاتجاه: يمين وشمال وطلوع ونزول.\n6. عشان كده الطيارة لازم تجري على المدرج الأول."}, {"n": 9, "t": "الـ QR Code بيخزن لينك في مربع ازاي؟", "e": "How a QR Code Stores a Link", "h": "المربعات الأبيض والأسود دي بتحمل كلام كامل.", "b": ["كل مربع صغير أسود أو أبيض بيمثل واحد أو صفر.", "التلات مربعات الكبار في الأركان بيقولوا للكاميرا: ده QR، وده اتجاهه.", "باقي المربعات بتحمل بيانات النص أو اللينك.", "فيه كمان مربعات تصحيح أخطاء. عشان كده الكود ممكن يتقرأ حتى لو جزء منه اتبوظ.", "الكاميرا بتصور الكود، والبرنامج يحول الأصفار والواحدات لنص، والتليفون يفتح اللينك."], "f": ["QR بيخزن بيانات في شبكة مربعات.", "فيه تصحيح أخطاء مدمج.", "ركنه المميز بيحدد الاتجاه."], "s": "المربعات الأبيض والأسود دي بتحمل كلام كامل.\n\n1. كل مربع صغير أسود أو أبيض بيمثل واحد أو صفر.\n2. التلات مربعات الكبار في الأركان بيقولوا للكاميرا: ده QR، وده اتجاهه.\n3. باقي المربعات بتحمل بيانات النص أو اللينك.\n4. فيه كمان مربعات تصحيح أخطاء. عشان كده الكود ممكن يتقرأ حتى لو جزء منه اتبوظ.\n5. الكاميرا بتصور الكود، والبرنامج يحول الأصفار والواحدات لنص، والتليفون يفتح اللينك."}, {"n": 10, "t": "بصمة الصباع بتفتح التليفون ازاي؟", "e": "How a Fingerprint Sensor Unlocks Your Phone", "h": "التليفون مش بيخزن صورة بصمتك، بيخزن خريطة منها.", "b": ["البصمة فيها خطوط بارزة وخطوط غايرة، ومحدش بصمته زي التاني.", "الحساس بياخد صورة للبصمة (بالضوء أو بالكهربا حسب النوع).", "البرنامج بيحدد نقط مميزة في الخطوط ويعمل منها خريطة رقمية.", "الخريطة دي بتتخزن مشفرة في جزء معزول جوه التليفون.", "كل مرة تحط صباعك، بيقارن الخريطة الجديدة بالمخزنة، ولو اتشابهت يفتح."], "f": ["بيخزن قالب رقمي مشفر مش صورة.", "بيقارن نقط مميزة في الخطوط.", "فيه حساسات ضوئية وسعوية."], "s": "التليفون مش بيخزن صورة بصمتك، بيخزن خريطة منها.\n\n1. البصمة فيها خطوط بارزة وخطوط غايرة، ومحدش بصمته زي التاني.\n2. الحساس بياخد صورة للبصمة (بالضوء أو بالكهربا حسب النوع).\n3. البرنامج بيحدد نقط مميزة في الخطوط ويعمل منها خريطة رقمية.\n4. الخريطة دي بتتخزن مشفرة في جزء معزول جوه التليفون.\n5. كل مرة تحط صباعك، بيقارن الخريطة الجديدة بالمخزنة، ولو اتشابهت يفتح."}, {"n": 11, "t": "الأسانسير بيطلع ازاي من غير ما يقع؟", "e": "How an Elevator Moves Safely", "h": "أسانسير فيه ناس بيتحرك في بنايات عالية، وفيه أكتر من طريقة أمان.", "b": ["الكابينة متعلقة بحبال حديد قوية بتلف على بكرة (بولي) فوق.", "في الناحية التانية من الحبل فيه ثقل موازن وزنه تقريبا وزن الكابينة ونص الحمولة.", "الموتور بيحتاج يحرك الفرق بس بين الوزنين، فيستهلك كهربا أقل.", "فيه فرامل بتمسك الكابينة لو الموتور وقف.", "ولو السرعة زادت زيادة خطيرة، نظام أمان يمسك القضبان على الجانبين ويثبت الكابينة."], "f": ["الثقل الموازن بيخفف حمل الموتور.", "فيه فرامل وقابض أمان.", "الحبال حديد متعدد."], "s": "أسانسير فيه ناس بيتحرك في بنايات عالية، وفيه أكتر من طريقة أمان.\n\n1. الكابينة متعلقة بحبال حديد قوية بتلف على بكرة (بولي) فوق.\n2. في الناحية التانية من الحبل فيه ثقل موازن وزنه تقريبا وزن الكابينة ونص الحمولة.\n3. الموتور بيحتاج يحرك الفرق بس بين الوزنين، فيستهلك كهربا أقل.\n4. فيه فرامل بتمسك الكابينة لو الموتور وقف.\n5. ولو السرعة زادت زيادة خطيرة، نظام أمان يمسك القضبان على الجانبين ويثبت الكابينة."}, {"n": 12, "t": "الدفع بالكارت من غير تلامس (NFC) بيشتغل ازاي؟", "e": "How Contactless Payment Works", "h": "بتقرب الكارت من الماكينة ثانية وتتحاسب.", "b": ["الكارت فيه شريحة وملف سلك صغير من غير بطارية.", "الماكينة بتبعت مجال كهرومغناطيسي، والملف جوه الكارت بيشحن شحنة صغيرة من المجال.", "الشحنة دي تشغل الشريحة، فتبعت بيانات الكارت المشفرة للماكينة.", "كل عملية بيتولد ليها كود لمرة واحدة، فلو حد سرق الكود مايقدرش يستخدمه تاني.", "المسافة قصيرة جدا (سنتيمترات)، وده جزء من الأمان."], "f": ["NFC مداه سنتيمترات.", "الكارت بياخد طاقة من الماكينة.", "بيستخدم كود مشفر لكل عملية."], "s": "بتقرب الكارت من الماكينة ثانية وتتحاسب.\n\n1. الكارت فيه شريحة وملف سلك صغير من غير بطارية.\n2. الماكينة بتبعت مجال كهرومغناطيسي، والملف جوه الكارت بيشحن شحنة صغيرة من المجال.\n3. الشحنة دي تشغل الشريحة، فتبعت بيانات الكارت المشفرة للماكينة.\n4. كل عملية بيتولد ليها كود لمرة واحدة، فلو حد سرق الكود مايقدرش يستخدمه تاني.\n5. المسافة قصيرة جدا (سنتيمترات)، وده جزء من الأمان."}, {"n": 13, "t": "شبكة الموبايل بتوصلك بالناس ازاي؟", "e": "How Mobile Networks Connect You", "h": "تليفونك بيكلم برج بعيد، والبرج يكلم تليفون التاني.", "b": ["المنطقة بتتقسم لخلايا، وكل خلية فيها برج.", "تليفونك بيبعت موجات راديو لأقرب برج بإشارة أقوى.", "البرج متوصل بشبكة سلك أو ألياف بتوصل الصوت والبيانات لباقي البلد.", "لو بتتحرك في عربية، الشبكة بتنقل مكالمتك من برج لبرج من غير ما تحس.", "ولما الزحمة تزيد على برج، السرعة بتقل لأن الكل بيتقاسم نفس الموجات."], "f": ["الشبكة مقسمة خلايا.", "الانتقال بين الأبراج اسمه handover.", "الزحمة بتبطء السرعة."], "s": "تليفونك بيكلم برج بعيد، والبرج يكلم تليفون التاني.\n\n1. المنطقة بتتقسم لخلايا، وكل خلية فيها برج.\n2. تليفونك بيبعت موجات راديو لأقرب برج بإشارة أقوى.\n3. البرج متوصل بشبكة سلك أو ألياف بتوصل الصوت والبيانات لباقي البلد.\n4. لو بتتحرك في عربية، الشبكة بتنقل مكالمتك من برج لبرج من غير ما تحس.\n5. ولما الزحمة تزيد على برج، السرعة بتقل لأن الكل بيتقاسم نفس الموجات."}, {"n": 14, "t": "كاميرا التليفون بتعمل صورة ازاي؟", "e": "How a Phone Camera Makes a Picture", "h": "العدسة بتجمع الضوء والشريحة بتحوله أرقام.", "b": ["العدسة بتركز الضوء الداخل على حساس صغير.", "الحساس مقسوم لملايين نقط صغيرة، كل نقطة بتقيس كمية الضوء اللي جتلها.", "فوق كل نقطة فلتر لون أحمر أو أخضر أو أزرق، فبنعرف اللون.", "المعالج بيجمع الأرقام ويكمل الألوان الناقصة ويظبط الإضاءة والحدة.", "وفي الليل، الكاميرا بتجمع كذا صورة وتدمجهم عشان تطلع أنضف."], "f": ["الحساس بيقيس شدة الضوء.", "فلاتر RGB فوق النقط.", "المعالج بيدمج ويحسن."], "s": "العدسة بتجمع الضوء والشريحة بتحوله أرقام.\n\n1. العدسة بتركز الضوء الداخل على حساس صغير.\n2. الحساس مقسوم لملايين نقط صغيرة، كل نقطة بتقيس كمية الضوء اللي جتلها.\n3. فوق كل نقطة فلتر لون أحمر أو أخضر أو أزرق، فبنعرف اللون.\n4. المعالج بيجمع الأرقام ويكمل الألوان الناقصة ويظبط الإضاءة والحدة.\n5. وفي الليل، الكاميرا بتجمع كذا صورة وتدمجهم عشان تطلع أنضف."}, {"n": 15, "t": "الفرق بين الهارد والـ SSD ايه؟", "e": "HDD vs SSD: How Each Stores Data", "h": "الاتنين بيحفظوا ملفاتك، بس بطريقتين مختلفتين خالص.", "b": ["الهارد التقليدي فيه أقراص معدنية بتلف بسرعة، وذراع صغير بيقرا ويكتب عليها بالمغناطيس.", "عشان كده ممكن يتأثر بالخبطات، وبيعمل صوت، وأبطأ.", "الـ SSD مفيهوش أجزاء متحركة، بيخزن البيانات في شرائح فلاش بشحنات كهربائية.", "عشان كده أسرع بكتير وأهدى وأخف.", "العيب إن ثمنه أغلى لكل جيجا، وعدد مرات الكتابة على كل خلية محدود."], "f": ["الهارد ميكانيكي مغناطيسي.", "SSD فلاش بدون أجزاء متحركة.", "SSD أسرع وأغلى للجيجا."], "s": "الاتنين بيحفظوا ملفاتك، بس بطريقتين مختلفتين خالص.\n\n1. الهارد التقليدي فيه أقراص معدنية بتلف بسرعة، وذراع صغير بيقرا ويكتب عليها بالمغناطيس.\n2. عشان كده ممكن يتأثر بالخبطات، وبيعمل صوت، وأبطأ.\n3. الـ SSD مفيهوش أجزاء متحركة، بيخزن البيانات في شرائح فلاش بشحنات كهربائية.\n4. عشان كده أسرع بكتير وأهدى وأخف.\n5. العيب إن ثمنه أغلى لكل جيجا، وعدد مرات الكتابة على كل خلية محدود."}, {"n": 16, "t": "موتور العربية بيحرك العربية ازاي؟", "e": "How a Car Engine Moves the Car", "h": "انفجارات صغيرة متتالية بتلف العجل.", "b": ["في الأسطوانة بنوب الهواء مع البنزين.", "الكبّاس بيضغط الخليط، والشمعة بتطلع شرارة فيحصل احتراق سريع.", "الانفجار بيدفع الكباس لتحت بقوة.", "الكباس متوصل بعمود مرفقي بيحول الحركة لأعلى وتحت لحركة دورانية.", "الدوران بيوصل للعجل من خلال علبة التروس.", "المراحل الأربعة: سحب، ضغط، احتراق، عادم. وتتكرر آلاف المرات في الدقيقة."], "f": ["دورة المحرك 4 أشواط: سحب، ضغط، احتراق، عادم.", "العمود المرفقي يحول الحركة.", "الشمعة تبدأ الاحتراق في البنزين."], "s": "انفجارات صغيرة متتالية بتلف العجل.\n\n1. في الأسطوانة بنوب الهواء مع البنزين.\n2. الكبّاس بيضغط الخليط، والشمعة بتطلع شرارة فيحصل احتراق سريع.\n3. الانفجار بيدفع الكباس لتحت بقوة.\n4. الكباس متوصل بعمود مرفقي بيحول الحركة لأعلى وتحت لحركة دورانية.\n5. الدوران بيوصل للعجل من خلال علبة التروس.\n6. المراحل الأربعة: سحب، ضغط، احتراق، عادم. وتتكرر آلاف المرات في الدقيقة."}, {"n": 17, "t": "العربية الكهربا بتشحن نفسها وهي بتفرمل ازاي؟", "e": "How Electric Cars Recover Energy When Braking", "h": "الفرملة في العربية الكهربا ممكن تشحن البطارية شوية.", "b": ["موتور العربية الكهربا بيحول الكهربا لحركة.", "لو تدوس فرامل أو ترفع رجلك، الموتور بيشتغل بالعكس كمولد.", "حركة العجل بتحول لكهربا تدخل للبطارية.", "الحركة بتقل لأن الموتور بيقاوم الدوران، فده بيعمل فرملة.", "مش بتشحن كل البطارية، بس بترجع جزء من الطاقة اللي كانت هتضيع حرارة في الفرامل."], "f": ["الفرملة بالاسترجاع تحول الموتور لمولد.", "بترجع جزء من الطاقة فقط.", "بتخفف تآكل الفرامل."], "s": "الفرملة في العربية الكهربا ممكن تشحن البطارية شوية.\n\n1. موتور العربية الكهربا بيحول الكهربا لحركة.\n2. لو تدوس فرامل أو ترفع رجلك، الموتور بيشتغل بالعكس كمولد.\n3. حركة العجل بتحول لكهربا تدخل للبطارية.\n4. الحركة بتقل لأن الموتور بيقاوم الدوران، فده بيعمل فرملة.\n5. مش بتشحن كل البطارية، بس بترجع جزء من الطاقة اللي كانت هتضيع حرارة في الفرامل."}, {"n": 18, "t": "اللوح الشمسي بيعمل كهربا من الشمس ازاي؟", "e": "How a Solar Panel Makes Electricity", "h": "ضوء بيتحول لكهربا من غير أي حركة.", "b": ["اللوح مصنوع من خلايا سيليكون.", "ضوء الشمس فيه جزيئات طاقة اسمها فوتونات.", "لما فوتون يخبط في السيليكون، بيحرر إلكترون.", "تركيب الخلية بيخلي الإلكترونات تمشي في اتجاه واحد، وده تيار كهربائي.", "التيار بيطلع مستمر، والإنفرتر بيحوله متردد عشان يشغل أجهزة البيت."], "f": ["الخلية الكهروضوئية بتحول الضوء لكهربا.", "التيار الناتج مستمر DC.", "الإنفرتر يحوله لـ AC."], "s": "ضوء بيتحول لكهربا من غير أي حركة.\n\n1. اللوح مصنوع من خلايا سيليكون.\n2. ضوء الشمس فيه جزيئات طاقة اسمها فوتونات.\n3. لما فوتون يخبط في السيليكون، بيحرر إلكترون.\n4. تركيب الخلية بيخلي الإلكترونات تمشي في اتجاه واحد، وده تيار كهربائي.\n5. التيار بيطلع مستمر، والإنفرتر بيحوله متردد عشان يشغل أجهزة البيت."}, {"n": 19, "t": "المحطة النووية بتعمل كهربا ازاي؟", "e": "How a Nuclear Plant Makes Electricity", "h": "بتسخن مياه بذرات بتنقسم، والباقي زي أي محطة تانية.", "b": ["ذرات اليورانيوم لما بتنقسم بتطلع حرارة كبيرة. ده اسمه انشطار نووي.", "الحرارة دي بتسخن مياه وتحولها لبخار.", "البخار بيلف توربين كبير.", "التوربين متوصل بمولد بيحول الدوران لكهربا.", "البخار بيتبرد ويرجع مياه ويلف تاني. وفيه حواجز وأنظمة تحكم لتنظيم التفاعل."], "f": ["الانشطار يعطي حرارة.", "توربين بخاري + مولد.", "التفاعل بيتحكم فيه."], "s": "بتسخن مياه بذرات بتنقسم، والباقي زي أي محطة تانية.\n\n1. ذرات اليورانيوم لما بتنقسم بتطلع حرارة كبيرة. ده اسمه انشطار نووي.\n2. الحرارة دي بتسخن مياه وتحولها لبخار.\n3. البخار بيلف توربين كبير.\n4. التوربين متوصل بمولد بيحول الدوران لكهربا.\n5. البخار بيتبرد ويرجع مياه ويلف تاني. وفيه حواجز وأنظمة تحكم لتنظيم التفاعل."}, {"n": 20, "t": "الإنترنت بيعرف يوصلك لموقع باسمه ازاي؟", "e": "How the Internet Finds a Website by Name", "h": "انت بتكتب اسم، والجهاز بيدور على رقم.", "b": ["كل موقع ليه عنوان رقمي اسمه IP، زي رقم تليفون.", "بنكتب الاسم عشان أسهل في الحفظ.", "تليفونك بيسأل خدمة اسمها DNS: الاسم ده رقمه إيه؟", "الـ DNS بيرد بالرقم، والتليفون يتصل بيه.", "الاستعلام بيتحفظ بعد كده عشان يبقى أسرع في المرة الجاية.", "من غير DNS كنت هتحتاج تحفظ أرقام."], "f": ["DNS يحول الاسم لعنوان IP.", "الرد بيتخزن مؤقتا.", "IP عنوان رقمي."], "s": "انت بتكتب اسم، والجهاز بيدور على رقم.\n\n1. كل موقع ليه عنوان رقمي اسمه IP، زي رقم تليفون.\n2. بنكتب الاسم عشان أسهل في الحفظ.\n3. تليفونك بيسأل خدمة اسمها DNS: الاسم ده رقمه إيه؟\n4. الـ DNS بيرد بالرقم، والتليفون يتصل بيه.\n5. الاستعلام بيتحفظ بعد كده عشان يبقى أسرع في المرة الجاية.\n6. من غير DNS كنت هتحتاج تحفظ أرقام."}, {"n": 21, "t": "ترمومتر الجبهة بيقيس الحرارة من غير لمس ازاي؟", "e": "How an Infrared Thermometer Works", "h": "أي جسم دافي بيطلع أشعة تحت حمراء، والجهاز بيقيسها.", "b": ["كل جسم بيطلع إشعاع حراري حسب درجة حرارته، الأسخن بيطلع أكتر.", "الأشعة دي تحت الحمراء ومش بنشوفها.", "عدسة الجهاز بتجمعها على حساس حراري.", "الحساس بيحول الإشعاع لإشارة كهربائية.", "المعالج بيحولها لرقم بالدرجة المئوية ويظهره.", "القياس بيتأثر بالمسافة وعرق الجبهة والجو."], "f": ["الجسم الدافي بيطلع أشعة تحت حمراء.", "الحساس بيحولها لإشارة كهربائية.", "دقته تتأثر بالمسافة والظروف."], "s": "أي جسم دافي بيطلع أشعة تحت حمراء، والجهاز بيقيسها.\n\n1. كل جسم بيطلع إشعاع حراري حسب درجة حرارته، الأسخن بيطلع أكتر.\n2. الأشعة دي تحت الحمراء ومش بنشوفها.\n3. عدسة الجهاز بتجمعها على حساس حراري.\n4. الحساس بيحول الإشعاع لإشارة كهربائية.\n5. المعالج بيحولها لرقم بالدرجة المئوية ويظهره.\n6. القياس بيتأثر بالمسافة وعرق الجبهة والجو."}, {"n": 22, "t": "جهاز إنذار الدخان بيحس بالحريق ازاي؟", "e": "How a Smoke Detector Senses Fire", "h": "حاجة صغيرة على السقف بتنقذ حياة ناس.", "b": ["فيه نوع بيستخدم ضوء وحساس: في الوضع العادي الضوء مش بيوصل للحساس.", "لما الدخان يدخل الغرفة، بيشتت الضوء فيوصل جزء منه للحساس.", "الحساس بيحس ويشغل الإنذار.", "فيه نوع تاني (أيوني) بيحس بتغير في تيار كهربائي صغير لما الدخان يدخل.", "عشان كده لازم تغير البطارية وتختبر الجهاز كل فترة."], "f": ["نوع ضوئي ونوع أيوني.", "الدخان يغير الإشارة.", "اختبار البطارية مهم."], "s": "حاجة صغيرة على السقف بتنقذ حياة ناس.\n\n1. فيه نوع بيستخدم ضوء وحساس: في الوضع العادي الضوء مش بيوصل للحساس.\n2. لما الدخان يدخل الغرفة، بيشتت الضوء فيوصل جزء منه للحساس.\n3. الحساس بيحس ويشغل الإنذار.\n4. فيه نوع تاني (أيوني) بيحس بتغير في تيار كهربائي صغير لما الدخان يدخل.\n5. عشان كده لازم تغير البطارية وتختبر الجهاز كل فترة."}, {"n": 23, "t": "الرنين المغناطيسي (MRI) بيصور جوه جسمك ازاي؟", "e": "How an MRI Sees Inside the Body", "h": "من غير أشعة إكس، بمغناطيس ضخم وموجات راديو.", "b": ["جسمك فيه مية كتير، والمية فيها ذرات هيدروجين.", "المغناطيس الضخم بيخلي ذرات الهيدروجين تصطف في اتجاه واحد.", "الجهاز بيبعت نبضة راديو، فتتحرف الذرات، ولما توقف بترجع وتطلع إشارة.", "كل نسيج بيرجع بسرعة مختلفة، فالإشارة بتختلف من عضلة لعضم لمخ.", "الكمبيوتر بيحول الإشارات دي لصور مقطعية دقيقة.", "عشان كده ممنوع المعادن في الغرفة: المغناطيس قوي جدا."], "f": ["MRI مش بيستخدم أشعة إكس.", "بيعتمد على مغناطيس وموجات راديو.", "بيتتبع ذرات الهيدروجين."], "s": "من غير أشعة إكس، بمغناطيس ضخم وموجات راديو.\n\n1. جسمك فيه مية كتير، والمية فيها ذرات هيدروجين.\n2. المغناطيس الضخم بيخلي ذرات الهيدروجين تصطف في اتجاه واحد.\n3. الجهاز بيبعت نبضة راديو، فتتحرف الذرات، ولما توقف بترجع وتطلع إشارة.\n4. كل نسيج بيرجع بسرعة مختلفة، فالإشارة بتختلف من عضلة لعضم لمخ.\n5. الكمبيوتر بيحول الإشارات دي لصور مقطعية دقيقة.\n6. عشان كده ممنوع المعادن في الغرفة: المغناطيس قوي جدا."}, {"n": 24, "t": "فرامل ABS بتمنع العربية من الانزلاق ازاي؟", "e": "How ABS Brakes Prevent Skidding", "h": "لو دست فرامل جامد، العجل بيفضل يلف شوية بدل ما يتقفل.", "b": ["لما العجل يتقفل على طريق مبلول، العربية بتنزلق وتفقد التحكم.", "حساس على كل عجلة بيقيس سرعة دورانها.", "لو حس إن عجلة هتتقفل، الكمبيوتر بيفلت ضغط الفرامل عليها ثانية.", "بعدين يرجع يضغط، وبيعمل كده مرات كتير في الثانية.", "النتيجة إنك تقدر تفرمل وتحرك الدريكسيون في نفس الوقت.", "ممكن تحس بنبض في الدواسة وده طبيعي."], "f": ["ABS يمنع قفل العجل.", "بيعمل ضغط وفلت متكرر.", "يسمح بالتوجيه أثناء الفرملة."], "s": "لو دست فرامل جامد، العجل بيفضل يلف شوية بدل ما يتقفل.\n\n1. لما العجل يتقفل على طريق مبلول، العربية بتنزلق وتفقد التحكم.\n2. حساس على كل عجلة بيقيس سرعة دورانها.\n3. لو حس إن عجلة هتتقفل، الكمبيوتر بيفلت ضغط الفرامل عليها ثانية.\n4. بعدين يرجع يضغط، وبيعمل كده مرات كتير في الثانية.\n5. النتيجة إنك تقدر تفرمل وتحرك الدريكسيون في نفس الوقت.\n6. ممكن تحس بنبض في الدواسة وده طبيعي."}, {"n": 25, "t": "قفل الوجه (Face ID) بيعرفك ازاي؟", "e": "How Face Unlock Recognizes You", "h": "التليفون بيبني خريطة ثلاثية الأبعاد لوشك.", "b": ["بعض التليفونات بتطلع آلاف نقط ضوء تحت حمراء على الوش.", "كاميرا بتصور النقط وتحسب شكل الوش وعمقه.", "الخريطة دي بتتحول لقالب رقمي بيتخزن مشفر.", "كل مرة، التليفون بيقارن الخريطة الجديدة بالقديمة.", "عشان كده صورة الوش لوحدها غالبا مش بتفتح الأنظمة المعتمدة على العمق.", "النظام بيتأقلم مع تغير بسيط زي لحية أو نضارة."], "f": ["بعض الأنظمة تعتمد على العمق.", "القالب الرقمي مخزن مشفر.", "مش كل التليفونات بنفس الطريقة."], "s": "التليفون بيبني خريطة ثلاثية الأبعاد لوشك.\n\n1. بعض التليفونات بتطلع آلاف نقط ضوء تحت حمراء على الوش.\n2. كاميرا بتصور النقط وتحسب شكل الوش وعمقه.\n3. الخريطة دي بتتحول لقالب رقمي بيتخزن مشفر.\n4. كل مرة، التليفون بيقارن الخريطة الجديدة بالقديمة.\n5. عشان كده صورة الوش لوحدها غالبا مش بتفتح الأنظمة المعتمدة على العمق.\n6. النظام بيتأقلم مع تغير بسيط زي لحية أو نضارة."}, {"n": 26, "t": "السد العالي بيعمل كهربا من الميّه ازاي؟", "e": "How a Hydroelectric Dam Makes Power", "h": "المية اللي واقفة ورا السد فيها طاقة كبيرة.", "b": ["الميّه المحجوزة ورا السد في مكان عالي.", "بتنزل من أنابيب كبيرة بسرعة وضغط.", "الميّه بتلف توربين.", "التوربين متوصل بمولد بيحول ال
